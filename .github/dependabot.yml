version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      aws-cdk:
        patterns:
          - "aws-cdk*"
          - "constructs"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"